<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABL - Confirmação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="page-wrapper">
    <div class="page-content">
      <div class="spacer-xl"></div>

      <h1 class="title">Confirmação do <span class="text-green">Auxílio</span></h1>
      <p class="subtitle">Verifique os dados antes de continuar.</p>

      <!-- Confirmation Card -->
      <div class="card card--accent">
        <div class="card__title">Valor a Receber</div>

        <div class="card-row">
          <div class="card-row__icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/>
            </svg>
          </div>
          <div class="card-row__text">
            <div class="card-row__label">Cashback</div>
            <div class="card-row__value card-row__value--large">R$ 4.000,00</div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="card-row">
          <div class="card-row__icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM9 10H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z"/>
            </svg>
          </div>
          <div class="card-row__text">
            <div class="card-row__label">Novo Plano</div>
            <div class="card-row__value">12x de R$ 500,00</div>
          </div>
        </div>

        <div class="card-row">
          <div class="card-row__icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
            </svg>
          </div>
          <div class="card-row__text">
            <div class="card-row__label">Recebimento do Cashback</div>
            <div class="card-row__value">Após 30 dias</div>
          </div>
        </div>

        <!-- Note -->
        <div class="note">
          <svg class="note__icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
          <span class="note__text">Ao confirmar, enviaremos o contrato para assinatura digital no seu e-mail.</span>
        </div>
      </div>
    </div>

    <!-- Footer CTAs -->
    <div class="page-footer">
      <a href="signature.html" class="btn btn--primary">
        Confirmar e assinar
        <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
      </a>
      <a href="offer.html" class="btn btn--ghost">Cancelar</a>
    </div>

  </div>
</body>
</html>
