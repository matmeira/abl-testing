<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABL - Assinatura Confirmada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="page-wrapper">
    <div class="page-content page-content--centered">

      <!-- Hero Icon (Checkmark) -->
      <div class="hero-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
        </svg>
      </div>

      <h1 class="title title--center">Assinatura confirmada!</h1>
      <p class="subtitle subtitle--center">
        Seu novo contrato foi assinado com sucesso. Agora é só aguardar o processamento do seu cashback.
      </p>

      <!-- What happens now -->
      <div style="width: 100%; text-align: left;">
        <div class="section-label">O que acontece agora?</div>

        <div class="timeline">
          <!-- Step 1 - Active -->
          <div class="timeline-item">
            <div class="timeline-item__icon timeline-item__icon--active">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
              </svg>
            </div>
            <span class="timeline-item__text">Assinatura em validação</span>
          </div>

          <!-- Step 2 - Pending -->
          <div class="timeline-item timeline-item--pending">
            <div class="timeline-item__icon timeline-item__icon--pending">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
              </svg>
            </div>
            <span class="timeline-item__text">Processamento do cashback</span>
          </div>

          <!-- Step 3 - Pending -->
          <div class="timeline-item timeline-item--pending">
            <div class="timeline-item__icon timeline-item__icon--pending">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/>
              </svg>
            </div>
            <span class="timeline-item__text">Depósito na conta</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer CTA -->
    <div class="page-footer">
      <a href="../index.html" class="btn btn--primary">Entendi</a>
    </div>

  </div>
</body>
</html>
